# ---------------------------------------------------------------------------
# The single server block. Port 80, everything on one hostname.
#
# There are no routes in this file on purpose: each feature owns exactly one
# file in conf.d/locations/, so adding a feature never means editing a file
# that other features depend on.
# ---------------------------------------------------------------------------

server {
    listen      80 default_server;
    server_name _;

    # Health endpoint for docker's healthcheck / monitoring. Never proxied.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- one file per feature ----
    include /etc/nginx/conf.d/locations/*.conf;
}
