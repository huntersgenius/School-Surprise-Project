# ---------------------------------------------------------------------------
# The single server block. Port 80, everything on one hostname.
#
# There are no routes in this file on purpose: each feature owns exactly one
# file in conf.d/locations/, so adding a feature never means editing a file
# that other features depend on.
# ---------------------------------------------------------------------------

server {
    listen      80 default_server;
    server_name _;

    # HTTPS on the same server block, same routes.
    #
    # Students never need it: open content (library, ebooks, news, games,
    # homepage) is served over plain http exactly as before. It exists because
    # Authelia refuses to run with an http:// portal URL, so anything behind
    # login has to be https — those routes include snippets/require-https.conf
    # and redirect themselves. See docker-compose.yml's `certs` service.
    listen      443 ssl default_server;
    http2       on;

    ssl_certificate     /etc/nginx/certs/public.crt;
    ssl_certificate_key /etc/nginx/certs/private.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Health endpoint for docker's healthcheck / monitoring. Never proxied.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- one file per feature ----
    include /etc/nginx/conf.d/locations/*.conf;
}
