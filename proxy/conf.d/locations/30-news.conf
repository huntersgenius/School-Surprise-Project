# NEWS — Grav CMS.
#
# Grav has no "base path" header equivalent, so this route strips the /news
# prefix and Grav is told about the public prefix via `custom_base_url` in
# services/news/seed/config/system.yaml (installed by seed-content.sh).
#
# Because the prefix is stripped with `rewrite ... break`, proxy_pass must NOT
# carry a URI of its own — with a variable upstream, nginx would send that URI
# verbatim for every request instead of substituting the path.

location = /news {
    return 301 /news/;
}

location /news/ {
    set $news_upstream http://news:80;
    rewrite ^/news/(.*)$ /$1 break;
    proxy_pass $news_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Grav's admin panel does image uploads.
    client_max_body_size 64m;
}

