# NEWS — Grav CMS.
#
# DO NOT STRIP THE /news PREFIX HERE. Grav is told its public base path via
# `custom_base_url` in user/config/system.yaml (set by seed-content.sh), and
# once it knows that base it expects to RECEIVE it in the request URI and
# strips it itself. Rewriting /news/foo to /foo before proxying makes Grav
# 404 every page while still generating correct-looking links — which is a
# genuinely confusing failure to debug. Pass the path through untouched, the
# same way the kiwix route does.

location = /news {
    return 301 /news/;
}

location /news/ {
    set $news_upstream http://news:80;
    proxy_pass $news_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Grav's admin panel does image uploads.
    client_max_body_size 64m;
}

