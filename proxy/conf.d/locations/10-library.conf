# LIBRARY — kiwix-serve (Wikipedia / Khan Academy ZIM files).
#
# kiwix-serve is started with --urlRootLocation=/library (see
# docker-compose.yml), so it generates its own links under /library and the
# path is passed through untouched — no rewriting, no broken relative URLs.

location /library {
    set $library_upstream http://library:8080;
    proxy_pass $library_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Full-text search over a 40GB ZIM can take a moment on a Pi.
    proxy_read_timeout 120s;
}
