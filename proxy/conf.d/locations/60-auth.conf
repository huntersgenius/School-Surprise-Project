# AUTH — Authelia.
#
# Two things live here:
#   1. /authelia/  — the login portal students actually see.
#   2. /internal/authelia/authz — the internal endpoint nginx calls on every
#      request to a gated route. Not reachable from outside (`internal`).
#
# Authelia is configured with the base path /authelia (server.address in
# auth/configuration.yml), which is what lets the portal and the protected
# apps share one hostname and therefore one session cookie — no subdomains,
# no DNS entries, which we can't create on a school network anyway.

location /authelia {
    set $authelia_upstream http://auth:9091;
    proxy_pass $authelia_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /internal/authelia/authz {
    internal;

    # Fixed endpoint: with a variable upstream, nginx sends this URI as-is,
    # which is exactly what we want here.
    set $authelia_authz http://auth:9091/authelia/api/authz/auth-request;
    proxy_pass $authelia_authz;

    # Authelia needs to know what the ORIGINAL request was, not this
    # subrequest — that's what it evaluates its access_control rules against.
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Content-Length    "";
    proxy_set_header Connection        "";

    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_redirect http:// $scheme://;
    proxy_cache_bypass $cookie_authelia_session;
    proxy_no_cache     $cookie_authelia_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}
