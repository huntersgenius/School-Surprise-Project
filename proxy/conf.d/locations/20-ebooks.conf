# EBOOKS — Calibre-web.
#
# Calibre-web understands the X-Script-Name header: it uses it as the app's
# base path, so it emits links under /ebooks and we can pass the full path
# straight through. If you ever move this route, change BOTH the location and
# the X-Script-Name value.

location /ebooks {
    set $ebooks_upstream http://ebooks:8083;
    proxy_pass $ebooks_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    proxy_set_header X-Script-Name /ebooks;

    # Uploading an epub through the Calibre-web UI, and downloading a big one.
    client_max_body_size 512m;
    proxy_read_timeout 300s;
}
