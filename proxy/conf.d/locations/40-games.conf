# GAMES — custom Node/Express/Socket.io service (chess + checkers).
#
# THIS ROUTE IS SHAPED DIFFERENTLY FROM THE OTHERS: Socket.io starts as an
# HTTP request and then upgrades to a websocket, which nginx only allows if
# the Upgrade/Connection headers are forwarded (websocket.conf) and response
# buffering is off. Without those two includes the lobby loads fine and then
# moves silently never arrive — the classic symptom of a proxy that forgot
# the upgrade headers.
#
# The app serves itself under BASE_PATH=/games (including its socket endpoint
# at /games/socket.io/), so the path passes through unmodified.

location = /games {
    return 301 /games/;
}

location /games/ {
    set $games_upstream http://games:3000;
    proxy_pass $games_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/websocket.conf;
}

# Games are open to everyone on the LAN right now. To require login instead,
# add this one line inside the /games/ block above:
