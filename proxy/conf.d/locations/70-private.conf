# PRIVATE — the end-to-end proof that shared login works, and the copy/paste
# template for gating any future route.
#
# Visit http://schoolhub.local/private/ logged out  -> redirected to the
# Authelia portal; log in -> bounced straight back here. That's the whole
# contract. Nothing else in the stack is gated yet (deliberately).
#
# Delete this route whenever you like; it exists purely as a working example.

location = /private {
    return 301 /private/;
}

location /private/ {
    # ---- the only line that makes a route "logged-in users only" ----
    include /etc/nginx/snippets/authelia-authrequest.conf;

    set $homepage_upstream http://homepage:80;
    proxy_pass $homepage_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}
