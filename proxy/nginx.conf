# ---------------------------------------------------------------------------
# SchoolHub reverse proxy — main nginx config.
#
# You almost never need to touch this file. Routes live in
# conf.d/locations/<nn>-<feature>.conf, one file per feature.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Default proxy timeouts, set here rather than in the proxy-headers
    # snippet: a directive may appear only ONCE per context, so a location
    # that includes the snippet could not then set its own. At http level a
    # location is free to override any of these.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ZIM pages and ebooks can be large; don't buffer whole responses to disk.
    client_max_body_size 64m;
    proxy_buffering on;
    proxy_busy_buffers_size 256k;
    proxy_buffers 8 128k;
    proxy_buffer_size 128k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    # Docker's embedded DNS server. Every location resolves its upstream
    # through a variable (see the location files), which means nginx starts
    # even when a backend container is missing or still building — one broken
    # service can't take the whole front door down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Required for websocket proxying (games/Socket.io). "Connection: upgrade"
    # only when the client actually asked to upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
