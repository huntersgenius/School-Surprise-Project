# Force this one route onto HTTPS.
#
# Include this in any location that also includes authelia-authrequest.conf.
# The reason is not general security policy — open content is deliberately
# left on plain http — it is that Authelia 4.38+ will not start with an
# http:// portal URL, so its session cookie is issued Secure, so a gated route
# served over http would never receive the cookie and would loop through the
# login page forever.
#
#   location /staffroom/ {
#       include /etc/nginx/snippets/require-https.conf;
#       include /etc/nginx/snippets/authelia-authrequest.conf;
#       ...
#   }
#
# `if` is safe here: a bare `return` is one of the two documented uses that
# don't hit the "if is evil" problems in a location context.

if ($scheme = http) {
    return 301 https://$host$request_uri;
}
