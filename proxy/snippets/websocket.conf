# Websocket support. Include this IN ADDITION to proxy-headers.conf in any
# location whose backend speaks websockets (Socket.io, live reload, etc.):
#
#   include /etc/nginx/snippets/proxy-headers.conf;
#   include /etc/nginx/snippets/websocket.conf;
#
# The $connection_upgrade map lives in nginx.conf's http block.

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# A websocket is a long-lived idle connection; the default 60s read timeout
# would drop players who are just thinking about their next move.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Buffering breaks the low-latency, message-at-a-time nature of a socket.
proxy_buffering off;
