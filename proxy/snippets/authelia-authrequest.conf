# ---------------------------------------------------------------------------
# Gate a route behind the shared login.
#
# Put ONE line inside any location block to require a logged-in user:
#
#   location /staffroom/ {
#       include /etc/nginx/snippets/authelia-authrequest.conf;   # <- this
#       set $upstream http://staffroom:8080;
#       proxy_pass $upstream;
#       include /etc/nginx/snippets/proxy-headers.conf;
#   }
#
# See proxy/conf.d/locations/70-private.conf for a live example, and the
# "Auth" section of PROJECT_PLAN.md for how to add users / restrict by group.
#
# Requires the internal authz endpoint defined in
# conf.d/locations/60-auth.conf.
# ---------------------------------------------------------------------------

# Ask Authelia whether this request is allowed, before doing anything else.
auth_request /internal/authelia/authz;

# Pull the identity Authelia returns out of the subrequest response...
auth_request_set $user   $upstream_http_remote_user;
auth_request_set $groups $upstream_http_remote_groups;
auth_request_set $name   $upstream_http_remote_name;
auth_request_set $email  $upstream_http_remote_email;

# ...and hand it to the backend, so apps that can consume a trusted header
# (Grav, Lemmy, anything custom) don't need their own login.
proxy_set_header Remote-User   $user;
proxy_set_header Remote-Groups $groups;
proxy_set_header Remote-Name   $name;
proxy_set_header Remote-Email  $email;

# Not logged in: Authelia answers 401 with a Location header pointing at its
# own portal (built from session.cookies[].authelia_url in
# auth/configuration.yml), including the ?rd= return address. Turn that into
# a browser redirect.
auth_request_set $redirection_url $upstream_http_location;
error_page 401 =302 $redirection_url;
