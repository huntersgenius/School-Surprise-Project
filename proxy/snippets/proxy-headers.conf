# Standard proxy headers. Include this in every proxied location block.
#
#   include /etc/nginx/snippets/proxy-headers.conf;

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Uri   $request_uri;

# NOTE: no proxy_*_timeout directives here on purpose. Several routes need
# their own (a ZIM search is slow, a websocket is idle for minutes), and nginx
# refuses to start if a directive appears twice in the same context — which is
# what happens when a location includes this file AND sets its own timeout.
# The defaults live in the http block in nginx.conf instead, where a location
# is free to override them.

# Don't leak backend identity headers to the LAN.
proxy_hide_header X-Powered-By;
